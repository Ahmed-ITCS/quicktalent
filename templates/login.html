{% extends "base_public.html" %}
{% block title %}Sign in — QuickTalent{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-head">
      <h1>Welcome back</h1>
      <p>Sign in to your company account.</p>
    </div>
    <form method="post" class="form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@company.com" required value="{{ form.email or '' }}">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Your password" required>
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Sign in</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
